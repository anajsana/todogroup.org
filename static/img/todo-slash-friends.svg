<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 -12 480 527" role="img" aria-label="Two friendly TODO slash characters exchange knowledge, ideas, and questions">
<desc>Two smiling green forward-slash friends wave and blink. They take turns sharing a brain, a lightbulb, and a question in speech bubbles.</desc>
<style>
.left-wave{transform-origin:283px 315px;animation:left-wave 9s ease-in-out infinite}.right-wave{transform-origin:428px 315px;animation:right-wave 9s ease-in-out infinite}.left-eyes,.right-eyes{transform-box:fill-box;transform-origin:center;animation:blink 9s linear infinite}.right-eyes{animation-delay:3.4s}.bubble{opacity:0;transform-box:fill-box;transform-origin:center bottom}.brain{animation:brain 9s ease-in-out infinite}.bulb{animation:bulb 9s ease-in-out infinite}.question{animation:question 9s ease-in-out infinite}
@keyframes left-wave{0%,4%,20%,67%,85%,100%{transform:rotate(0)}8%,14%,71%,77%{transform:rotate(-12deg)}11%,17%,74%,81%{transform:rotate(4deg)}}
@keyframes right-wave{0%,36%,54%,100%{transform:rotate(0)}40%,46%{transform:rotate(12deg)}43%,50%{transform:rotate(-4deg)}}
@keyframes blink{0%,35%,37%,79%,81%,100%{transform:scaleY(1)}36%,80%{transform:scaleY(.1)}}
@keyframes brain{0%,2%,30%,100%{opacity:0;transform:translateY(4px) scale(.94)}6%,25%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bulb{0%,35%,63%,100%{opacity:0;transform:translateY(4px) scale(.94)}39%,58%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes question{0%,68%,96%,100%{opacity:0;transform:translateY(4px) scale(.94)}72%,91%{opacity:1;transform:translateY(0) scale(1)}}

#left-friend{transform-origin:250px 430px;animation:left-float 4.6s ease-in-out infinite}
#right-affection{transform-origin:400px 430px;animation:nuzzle 12s ease-in-out infinite}
#right-friend{transform-origin:450px 430px;animation:right-float 4.6s ease-in-out infinite}
.left-hand{animation:left-hand 3s ease-in-out infinite}.left-outer-hand{animation:left-hand 3s 1.5s ease-in-out infinite}.right-outer-hand{animation:right-hand 3s ease-in-out infinite}.right-hand{animation:right-hand 3s 1.5s ease-in-out infinite}
@keyframes left-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes right-float{0%,100%{transform:translateY(-6px) rotate(1deg)}50%{transform:translateY(2px) rotate(-1deg)}}
@keyframes nuzzle{0%,35%,78%,100%{transform:rotate(0deg)}50%,61%{transform:rotate(-21deg)}}
@keyframes left-hand{0%,65%,100%{transform:translate(0,0)}20%{transform:translate(3px,-11px)}36%{transform:translate(0,-5px)}50%{transform:translate(3px,-10px)}}
@keyframes right-hand{0%,65%,100%{transform:translate(0,0)}20%{transform:translate(-3px,-11px)}36%{transform:translate(0,-5px)}50%{transform:translate(-3px,-10px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}.brain,.bulb{opacity:1}.question{opacity:0}}
</style>
<g class="bubble brain" aria-hidden="true"><rect x="254" y="15" width="108" height="70" rx="32" fill="#E6EFDF"/><path d="m285 80-5 22 26-22" fill="#E6EFDF"/><g fill="none" stroke="#016554" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M307 34c-6-7-15-1-14 5-7 1-9 10-4 14-3 7 4 13 10 11 2 6 8 5 8-1V34Zm0 0c6-7 15-1 14 5 7 1 9 10 4 14 3 7-4 13-10 11-2 6-8 5-8-1V34Z"/><path d="M293 40q8-2 7 5m-10 8q7-4 11 2m20-15q-8-2-7 5m10 8q-7-4-11 2"/></g></g>
<g class="bubble bulb" aria-hidden="true"><rect x="423" y="7" width="108" height="73" rx="32" fill="#F0F5DA"/><path d="m480 75 16 21-1-23" fill="#F0F5DA"/><g fill="none" stroke="#016554" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M469 53v-5c-12-10-6-25 8-25s20 15 8 25v5Z"/><path d="M470 59h14m-11 5h8m-4-12V39m-5-3 5 4 5-4m-5-22v-4m-21 15-4-2m46 2 4-2"/></g></g>
<g class="bubble question" aria-hidden="true"><rect x="254" y="15" width="108" height="70" rx="32" fill="#E6EFDF"/><path d="m285 80-5 22 26-22" fill="#E6EFDF"/><path d="M297 39c0-14 23-14 23-1 0 10-12 9-12 20" fill="none" stroke="#016554" stroke-width="3.5" stroke-linecap="round"/><circle cx="308" cy="68" r="2.3" fill="#016554"/></g>
<g id="left-friend"><path d="M300 164 200 430" fill="none" stroke="#016554" stroke-width="98" stroke-linecap="round"/><circle class="left-hand" cx="326" cy="314" r="12" fill="#016554"/><circle class="left-outer-hand" cx="170" cy="314" r="12" fill="#016554"/><g class="left-eyes" fill="#003E34"><circle cx="264" cy="245" r="4.2"/><circle cx="288" cy="245" r="4.2"/></g><path d="M269 262C272 267 280 267 283 262" fill="none" stroke="#003E34" stroke-width="4.4" stroke-linecap="round"/></g>
<g id="right-affection"><g id="right-friend"><path d="M500 164 400 430" fill="none" stroke="#A4CE39" stroke-width="98" stroke-linecap="round"/><circle class="right-hand" cx="372" cy="314" r="12" fill="#A4CE39"/><circle class="right-outer-hand" cx="522" cy="314" r="12" fill="#A4CE39"/><g transform="translate(-14 -1)"><g class="right-eyes" fill="#003E34"><circle cx="464" cy="245" r="4.2"/><circle cx="488" cy="245" r="4.2"/></g><path d="M469 262C472 267 480 267 483 262" fill="none" stroke="#003E34" stroke-width="4.4" stroke-linecap="round"/></g></g></g>
</svg>